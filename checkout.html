<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Lacoste</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/logo-lacoste.png" alt="Lacoste" onerror="this.style.display='none'; this.parentElement.innerText='LACOSTE'">
    </div>
    <div class="user-actions">
      <a href="/" style="text-decoration:none; color:#333;"><i class="fas fa-home" title="Voltar à Loja"></i></a>
    </div>
  </header>

  <main>
    <section class="checkout-page-container">
      <div class="checkout-layout">

        <!-- Coluna Esquerda: Formulários -->
        <div class="checkout-forms">
          <h2>Finalizar Pedido</h2>

          <!-- Passo 1: Endereço -->
          <div id="address-section">
            <h3>1. Endereço de Entrega</h3>
            <form id="address-form">
              <div class="form-row">
                <div class="form-group">
                  <label>CEP*</label>
                  <input type="text" id="cep" required placeholder="00000-000">
                </div>
                <div class="form-group">
                  <label>Estado*</label>
                  <input type="text" id="estado" required placeholder="SP">
                </div>
              </div>
              <div class="form-group">
                <label>Cidade*</label>
                <input type="text" id="cidade" required placeholder="São Paulo">
              </div>
              <div class="form-group">
                <label>Bairro*</label>
                <input type="text" id="bairro" required placeholder="Centro">
              </div>
              <div class="form-row">
                <div class="form-group" style="flex: 3;">
                  <label>Rua/Avenida*</label>
                  <input type="text" id="rua" required placeholder="Rua das Flores">
                </div>
                <div class="form-group" style="flex: 1;">
                  <label>Número*</label>
                  <input type="text" id="numero" required placeholder="123">
                </div>
              </div>
              <div class="form-group">
                <label>Complemento</label>
                <input type="text" id="complemento" placeholder="Apto, Bloco...">
              </div>
              <button type="button" id="btn-next-payment" class="btn-primary">Continuar para Pagamento</button>
            </form>
          </div>

          <!-- Passo 2: Pagamento (Oculto inicialmente) -->
          <div id="payment-section" style="display: none;">
            <h3>2. Pagamento</h3>

            <div class="payment-methods">
              <label class="method">
                <input type="radio" name="payment" value="pix"> Pix
              </label>
              <label class="method">
                <input type="radio" name="payment" value="card" checked> Cartão de Crédito
              </label>
            </div>

            <div id="card-fields">
              <div class="form-group">
                <label>Número do Cartão*</label>
                <input type="text" id="cartao-numero" placeholder="0000 0000 0000 0000">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Validade*</label>
                  <input type="text" id="cartao-validade" placeholder="MM/AA">
                </div>
                <div class="form-group">
                  <label>CVV*</label>
                  <input type="text" id="cartao-cvv" placeholder="123">
                </div>
              </div>
            </div>

            <h3>3. Dados Pessoais</h3>
            <div class="form-group">
              <label>Nome Completo*</label>
              <input type="text" id="nome" required placeholder="Como no cartão">
            </div>
            <div class="form-group">
              <label>CPF*</label>
              <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>
            <p id="cpf-error" class="error-msg">CPF inválido.</p>

            <button id="btn-finalize" class="btn-pay">Finalizar Compra</button>
            <button id="btn-back-address" class="btn-secondary" style="margin-top:10px;">Voltar ao Endereço</button>
          </div>
        </div>

        <!-- Coluna Direita: Resumo -->
        <div class="checkout-summary">
          <h3>Resumo do Pedido</h3>
          <div class="cart-items" id="cart-items">
            <!-- Itens via JS -->
          </div>
          <div class="cart-total-box">
            <p>Total a Pagar:</p>
            <span id="cart-total">R$ 0,00</span>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
